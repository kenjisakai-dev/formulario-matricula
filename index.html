<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estrelas do Amanhã</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="container py-md flex items-center gap-0.75">
          <img src="assets/logo.png" alt="logomarca" />
          <img src="assets/illustration.png" alt="imagem estrelas do amanhã" />
        </div>
      </header>

      <main class="py-md">
        <div class="container grid gap-3">
          <header>
            <a href="#" class="flex items-center gap-0.5">
              <img src="assets/icons/arrow-left.svg" alt="ícone de seta" />
              <span>Voltar</span>
            </a>

            <h1>Formulário de matrícula</h1>
            <p>
              Preencha os dados abaixo para matricular seu filho na escola de
              educação infantil Estrelas do Amanhã.
            </p>
          </header>

          <form method="GET" enctype="multipart/form-data">
            <fieldset id="child-info">
              <legend>Informações da criança</legend>

              <div class="input-wrapper">
                <label for="name-child">Nome completo</label>
                <input
                  id="name-child"
                  type="text"
                  name="name-child"
                  placeholder="Qual o nome da criança?"
                />
              </div>

              <div class="input-wrapper">
                <label for="birth">Data de nascimento</label>
                <input
                  id="birth"
                  type="date"
                  name="birth"
                  lang="pt-BR"
                  required
                />
              </div>

              <div class="select-wrapper">
                <label for="gender">Sexo</label>
                <select id="gender" name="gender" required>
                  <option selected value="">Selecione umas das opções</option>
                  <option name="gender" value="masculine">Masculino</option>
                  <option name="gender" value="feminine">Feminino</option>
                  <option name="gender" value="other">Outro</option>
                </select>
              </div>

              <div class="textarea-wrapper">
                <label for="medical-info">Informações médicas</label>
                <textarea
                  id="medical-info"
                  name="medical-info"
                  placeholder="A criança possui alguma condição médica que a escola deve estar ciente? (Se sim, especifique)"
                  rows="5"
                ></textarea>
              </div>
            </fieldset>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
